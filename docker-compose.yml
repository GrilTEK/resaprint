services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resaprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-resaprint}
    volumes:
      - resaprint-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resaprint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  ingest-worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "worker.py"]

volumes:
  resaprint-db-data:
