services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # env_file (not top-level ${VAR} interpolation) — Compose only
    # resolves ${VAR} syntax in this file from a .env at the repo root
    # or the shell environment, never from another service's env_file.
    # Since backend/.env.example is the one and only documented place
    # to set these, all services (including db) read from it directly.
    env_file: ./backend/.env
    volumes:
      - resaprint-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resaprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  ingest-worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "worker.py"]

volumes:
  resaprint-db-data:
