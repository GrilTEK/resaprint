<form hx-post="/stations" hx-target="body">
  <div class="form-row">
    <label>Name</label>
    <input type="text" name="name" required>
  </div>
  <div class="form-row">
    <label>Type</label>
    <select name="connection_type">
      <option value="lan_escpos">LAN ESC/POS</option>
      <option value="usb_agent">USB Agent (Windows)</option>
    </select>
  </div>
  <div class="form-row">
    <label>LAN host (leave blank for USB agent)</label>
    <input type="text" name="lan_host">
  </div>
  <div class="form-row">
    <label>LAN port</label>
    <input type="number" name="lan_port" value="9100">
  </div>
  <button type="submit">Create station</button>
</form>
