{% extends "base.html" %}
{% block title %}Log in — ResaPrint{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1>ResaPrint</h1>
  <form id="login-form" hx-post="/login" hx-target="#login-error" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) window.location.href='/'">
    <div class="pin-display" id="pin-display"></div>
    <input type="hidden" name="pin" id="pin-value">
    <div class="pin-pad">
      {% for n in [1,2,3,4,5,6,7,8,9] %}
      <button type="button" onclick="pushDigit('{{ n }}')">{{ n }}</button>
      {% endfor %}
      <button type="button" class="secondary" onclick="clearPin()">Clear</button>
      <button type="button" onclick="pushDigit('0')">0</button>
      <button type="submit">Enter</button>
    </div>
    <div id="login-error" class="error-text"></div>
  </form>
</div>
<script>
  let pin = "";
  function render() {
    document.getElementById('pin-display').textContent = "*".repeat(pin.length);
    document.getElementById('pin-value').value = pin;
  }
  function pushDigit(d) { if (pin.length < 12) { pin += d; render(); } }
  function clearPin() { pin = ""; render(); }
</script>
{% endblock %}
