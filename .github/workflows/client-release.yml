name: client-release

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ResaPrint.sln

      - name: Publish ResaPrint.Agent (self-contained, single-file, trimmed)
        run: >
          dotnet publish ResaPrint.Agent\ResaPrint.Agent.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out\agent

      - name: Publish ResaPrint.Tray (self-contained, single-file)
        # No PublishTrimmed here: Windows Forms does not support IL
        # trimming (NETSDK1175) — the Tray app is small anyway, so the
        # untrimmed self-contained size is an acceptable tradeoff.
        run: >
          dotnet publish ResaPrint.Tray\ResaPrint.Tray.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out\tray

      - name: Stage release contents
        shell: pwsh
        run: |
          $stage = "out\release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "out\agent\ResaPrint.Agent.exe" -Destination $stage
          Copy-Item "out\tray\ResaPrint.Tray.exe" -Destination $stage
          Copy-Item "installer" -Destination "$stage\installer" -Recurse
          Copy-Item "install.ps1" -Destination $stage
          Copy-Item "uninstall.ps1" -Destination $stage
          Copy-Item "..\docs\CLIENT.md" -Destination $stage

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path "out\release\*" -DestinationPath "out\ResaPrint-Client-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: client/out/ResaPrint-Client-${{ github.ref_name }}.zip
          generate_release_notes: true
