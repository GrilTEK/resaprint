name: client-release

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ResaPrint.sln

      - name: Publish ResaPrint.Agent (self-contained, single-file)
        # No PublishTrimmed: .NET's trimmer disables reflection-based
        # JsonSerializer by default (IsReflectionEnabledByDefault=false
        # under trimming), and DpapiConfigStore/ResaPrintApiClient use
        # plain JsonSerializer.Serialize/Deserialize without a source
        # generator — under trimming this throws
        # "Reflection-based serialization has been disabled for this
        # application" at runtime (confirmed on real hardware; dotnet
        # build/test don't catch it since trimming only applies at
        # publish time). Could be fixed with a JsonSerializerContext
        # source generator instead, but skipping trimming is simpler
        # and the size savings aren't worth the fragility for a small
        # background service.
        run: >
          dotnet publish ResaPrint.Agent\ResaPrint.Agent.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out\agent

      - name: Publish ResaPrint.Tray (self-contained, single-file)
        # No PublishTrimmed here: Windows Forms does not support IL
        # trimming (NETSDK1175) — the Tray app is small anyway, so the
        # untrimmed self-contained size is an acceptable tradeoff.
        run: >
          dotnet publish ResaPrint.Tray\ResaPrint.Tray.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out\tray

      - name: Stage Agent + Tray as the Installer's embedded payload
        # ResaPrint.Installer.csproj embeds everything under
        # Payload\*.exe as manifest resources at build time — staging
        # the two exes here *before* publishing the installer is what
        # makes the final ResaPrint.Installer.exe self-contained enough
        # to be the only file end users ever need to download.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ResaPrint.Installer\Payload" | Out-Null
          Copy-Item "out\agent\ResaPrint.Agent.exe" -Destination "ResaPrint.Installer\Payload" -Force
          Copy-Item "out\tray\ResaPrint.Tray.exe" -Destination "ResaPrint.Installer\Payload" -Force

      - name: Publish ResaPrint.Installer (self-contained, single-file, with embedded Agent/Tray payload)
        # Also Windows Forms — no PublishTrimmed, same reasoning as Tray.
        run: >
          dotnet publish ResaPrint.Installer\ResaPrint.Installer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out\installer-gui

      - name: Rename release asset
        shell: pwsh
        run: |
          Copy-Item "out\installer-gui\ResaPrint.Installer.exe" -Destination "out\ResaPrint-Client-${{ github.ref_name }}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: client/out/ResaPrint-Client-${{ github.ref_name }}.exe
          generate_release_notes: true
